submission:
  title: "SupplyChain Disruption Assistant & Fleet Utilisation Optimizer"  # REQUIRED

  problem_statement: >                           # REQUIRED — 1-3 sentences.
    Unpredictable transit corridor disruptions such as extreme weather, terminal strikes,
    and geopolitical blockages leave active shipments stranded and idle assets misallocated,
    while undetected cold chain temperature breaches cause catastrophic pharmaceutical and perishable cargo loss.

  solution_summary: >                            # REQUIRED — 1-3 sentences.
    SupplyShield L2 is an intelligent fleet management platform featuring an automated disruption
    impact and rerouting engine, multi-variable idle asset redeployment scoring, and real-time
    IoT cold chain monitoring powered by IBM Bob via a dedicated Model Context Protocol (MCP) server.

  key_features:                                  # REQUIRED — List 3 to 5 specific features
    - "IBM Bob Agentic Assistant with 13 Live Model Context Protocol (MCP) Operational Tools"
    - "Disruption Command Panel with Corridor Impact Matching & One-Click Rerouting"
    - "Idle Fleet Redeployment Optimizer with Multi-Factor Demand Priority Scoring"
    - "Real-Time Cold Chain IoT Telemetry & Automated Regulatory Excursion Severity Grading"
    - "Real-Time Command Center Integrating L2 Risk KPIs with Core Fleet Lifecycle Metrics"

  tech_stack:
    languages: ["JavaScript", "SQL"]             # REQUIRED
    frameworks: ["Next.js", "React"]
    ibm_technologies:
      - "IBM Bob (Agentic Assistant & Tool Executor)"
      - "Model Context Protocol (MCP) Server"
      - "watsonx.ai Granite 3.0 (Operational Reasoning)"
    databases: ["PostgreSQL", "Supabase"]
    other: ["Tailwind CSS", "Recharts", "Lucide React", "@modelcontextprotocol/sdk"]

  what_we_are_most_proud_of: >
    Empowering enterprise logistics dispatchers with load-bearing IBM Bob agentic intelligence via Model Context Protocol (MCP),
    performing auditable multi-corridor disruption triage and regulatory cold chain excursion compliance directly on live database records without black-box hallucination.

  known_limitations: >
    Direct hardware IoT gateway streaming currently utilizes web-based telemetry simulation;
    offline edge synchronization for remote cellular dead zones is planned for subsequent releases.

