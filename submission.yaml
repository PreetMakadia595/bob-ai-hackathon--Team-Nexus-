submission:
  title: "FleetFlow - Smart Fleet Management System"  # REQUIRED — Project display name

  problem_statement: >                           # REQUIRED — 1-3 sentences.
    Fleet operators face significant challenges in tracking vehicle availability,
    monitoring maintenance schedules, optimizing fuel consumption, and coordinating
    trip assignments across multiple drivers.

  solution_summary: >                            # REQUIRED — 1-3 sentences.
    FleetFlow is a unified, real-time fleet management platform built with Next.js
    and Supabase providing complete operational visibility across vehicles, drivers,
    trips, maintenance logs, and fuel expenditures.

  key_features:                                  # REQUIRED — List 3 to 5 specific features
    - "Real-Time Fleet Overview & Dynamic Operational Dashboard"
    - "Vehicle Lifecycle & Status Registry (Available, In Service, Maintenance)"
    - "Trip Dispatch & Driver Assignment Workflow"
    - "Preventive Maintenance Scheduling & Cost Logging"
    - "Fuel Expense Logging & Efficiency Metrics (km/L)"

  tech_stack:
    languages: ["JavaScript", "SQL"]             # REQUIRED
    frameworks: ["Next.js", "React"]
    ibm_technologies: []
    databases: ["PostgreSQL", "Supabase"]
    other: ["Tailwind CSS", "Recharts", "Lucide React"]

  what_we_are_most_proud_of: >
    Modular Next.js 16 App Router architecture paired with Supabase for real-time reactivity
    and robust role-based access control protecting fleet operations workflows.

  known_limitations: >
    Real-time GPS device telemetry integration requires hardware IoT gateway integration;
    offline-first caching with automatic sync is in active development.

